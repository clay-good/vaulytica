name: "Vaulytica contract review"
description: "Deterministic, no-AI legal-document linter — analyze or version-compare contracts in CI and gate on findings (SARIF, redline)."
author: "clay-good"
branding:
  icon: "shield"
  color: "green"

inputs:
  command:
    description: "Which subcommand to run: analyze | compare."
    required: false
    default: "analyze"
  files:
    description: "analyze: a path, single-segment glob, or directory of documents (.pdf/.docx/.txt/.md)."
    required: false
    default: ""
  base:
    description: "compare: the base document."
    required: false
    default: ""
  revised:
    description: "compare: the revised document."
    required: false
    default: ""
  format:
    description: "Output format(s). analyze: comma list of json,sarif,html,md,csv,docx,docx-comments,bundle-json,bundle-docx,bundle-zip,checklist-md,checklist-csv,dates-md,dates-ics,obligations-csv,deadlines-ics,posture-md,posture-csv,posture-sheet,definitions-csv (default sarif) — the checklist-* formats need the closing checklist and the dates-* formats need the critical-dates register, both of which the CLI computes only when asserted. `docx` is the full attorney-facing report and `docx-comments` a commented copy of the input; both are binary and need `out-dir`. The `bundle-*` values write one consolidated artifact for the whole set (implies the cross-document run, needs 2+ inputs and `out-dir`). compare: json|markdown (default markdown). Leave empty to take each command's default."
    required: false
    default: ""
  fail-on:
    description: "Exit non-zero when a finding (analyze) — or an introduced finding (compare) — is at or above this severity: critical|warning|info. Empty = never fail."
    required: false
    default: ""
  playbook:
    description: "Force a specific playbook id instead of auto-matching."
    required: false
    default: ""
  out:
    description: "analyze only: directory to write one file per document per format (e.g. for SARIF upload)."
    required: false
    default: ""
  consistency:
    description: "analyze only: set to true to read two or more inputs AS A BUNDLE and run the cross-document consistency checks. A directory is not a bundle — assert this only when the documents belong to the same deal. Set to 'only' to report the bundle and nothing else (no per-document report, and no 'out' needed)."
    required: false
    default: ""
  delivery:
    description: "analyze only: set to true to run the pre-disclosure scan (HANDOFF-001..005) over the uploaded container — tracked changes, comments, hidden content, authoring metadata, and sensitive-data patterns."
    required: false
    default: ""
  fail-on-delivery:
    description: "analyze only: exit non-zero when a PRE-DISCLOSURE finding is at or above this severity: critical|warning|info. Implies delivery. Separate from fail-on, which reads the run — the delivery scan sits outside it. Empty = never fail."
    required: false
    default: ""
  playbook-file:
    description: "analyze only: path to a custom playbook JSON in your repository (your team's positions), loaded instead of relying on the built-in match alone."
    required: false
    default: ""
  posture:
    description: "analyze only: set to true to classify the draft against the playbook-file's negotiation_positions. Requires playbook-file."
    required: false
    default: ""
  fail-on-posture:
    description: "analyze only: exit non-zero when any posture dimension sits at or below this rung: ideal|acceptable|below-acceptable. Implies posture. A not-stated dimension never trips it. Empty = never fail."
    required: false
    default: ""
  fail-on-divergence:
    description: "analyze only: set to true to exit non-zero when a posture front diverges across the bundle — the documents disagree with each other on a rung. Requires posture (and so playbook-file), and two or more inputs."
    required: false
    default: ""
  summary:
    description: "Write a GitHub job summary with the run's counts, caveats and gate result. Default true. The tool's human output is what a reader needs and it lands in the raw step log, which is collapsed by default — this puts it on the run page. Set false to keep the summary empty."
    required: false
    default: "true"
  fail-on-consistency:
    description: "analyze only: exit non-zero when a CROSS-DOCUMENT finding is at or above this severity: critical|warning|info. Implies consistency. Separate from fail-on, which scores each document alone. Empty = never fail."
    required: false
    default: ""
  production-qa:
    description: "analyze only: run production QA over a document production SET (a directory or .zip given in 'files') instead of per-document analysis — Bates sequence + privilege-log reconciliation against the single .csv member, plus a pre-production handoff sweep. Emits a JSON report with its own production_qa_hash."
    required: false
    default: "false"
  fail-on-production-gap:
    description: "analyze only: exit non-zero when production QA finds a Bates sequence gap. Implies production-qa. The CLI flag exists FOR this check — 'a CI check before a production goes out' — and until 9.631.0 the Action could not switch it on."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Install only the engine's runtime deps in the action's own checkout. `tsx`
    # is a runtime dependency, so the CLI runs from TypeScript source with no
    # build step. `--omit=dev` skips the heavy dev-only deps (the `sharp` native
    # build, Playwright) while still running `esbuild`'s postinstall — tsx needs
    # esbuild, and `--ignore-scripts` would leave its binary unconfigured.
    - name: Install Vaulytica
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund

    # Run against the consumer's checked-out files (GITHUB_WORKSPACE). The DKB
    # ships with the tool, so analysis opens no socket — nothing leaves the
    # runner. The CLI's own exit code (2 = --fail-on breach) propagates and
    # fails the step.
    - name: Run Vaulytica
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        VAULYTICA_BIN: ${{ github.action_path }}/bin/vaulytica.mjs
        CMD: ${{ inputs.command }}
        FILES: ${{ inputs.files }}
        BASE: ${{ inputs.base }}
        REVISED: ${{ inputs.revised }}
        FORMAT: ${{ inputs.format }}
        FAIL_ON: ${{ inputs.fail-on }}
        PLAYBOOK: ${{ inputs.playbook }}
        OUT: ${{ inputs.out }}
        CONSISTENCY: ${{ inputs.consistency }}
        DELIVERY: ${{ inputs.delivery }}
        FAIL_ON_DELIVERY: ${{ inputs.fail-on-delivery }}
        PLAYBOOK_FILE: ${{ inputs.playbook-file }}
        POSTURE: ${{ inputs.posture }}
        FAIL_ON_POSTURE: ${{ inputs.fail-on-posture }}
        FAIL_ON_DIVERGENCE: ${{ inputs.fail-on-divergence }}
        FAIL_ON_CONSISTENCY: ${{ inputs.fail-on-consistency }}
        SUMMARY: ${{ inputs.summary }}
        PRODUCTION_QA: ${{ inputs.production-qa }}
        FAIL_ON_PRODUCTION_GAP: ${{ inputs.fail-on-production-gap }}
      run: |
        set -euo pipefail
        args=("$CMD")
        if [ "$CMD" = "compare" ]; then
          if [ -z "$BASE" ] || [ -z "$REVISED" ]; then
            echo "::error::compare requires both 'base' and 'revised' inputs" >&2
            exit 1
          fi
          args+=("$BASE" "$REVISED")
        else
          if [ -z "$FILES" ]; then
            echo "::error::analyze requires the 'files' input" >&2
            exit 1
          fi
          args+=("$FILES")
        fi
        # `sarif` is the analyze-only default (it is what gets uploaded to code
        # scanning); compare accepts json|markdown and rejects sarif outright,
        # so passing the default through to compare failed every run. Leave the
        # flag off for compare unless the caller asked for a format explicitly,
        # letting each subcommand apply its own default.
        if [ -z "$FORMAT" ] && [ "$CMD" != "compare" ]; then
          FORMAT="sarif"
        fi
        [ -n "$FORMAT" ] && args+=(--format "$FORMAT")
        [ -n "$PLAYBOOK" ] && args+=(--playbook "$PLAYBOOK")
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        if [ "$CMD" = "analyze" ] && [ -n "$OUT" ]; then
          args+=(--out "$OUT")
        fi
        # The pre-disclosure scan and its gate. `--fail-on-delivery` implies the
        # scan, so the flag is enough on its own; `--fail-on` does NOT gate on
        # these findings, which is why the gate has a flag of its own.
        if [ "$CMD" = "analyze" ]; then
          if [ -n "$FAIL_ON_DELIVERY" ]; then
            args+=(--delivery --fail-on-delivery "$FAIL_ON_DELIVERY")
          elif [ "$DELIVERY" = "true" ]; then
            args+=(--delivery)
          fi
        fi
        # The team's own ladder. --posture needs the playbook file to score
        # against, so the flags only go on together.
        if [ "$CMD" = "analyze" ] && [ -n "$PLAYBOOK_FILE" ]; then
          args+=(--playbook-file "$PLAYBOOK_FILE")
          if [ -n "$FAIL_ON_POSTURE" ]; then
            args+=(--posture --fail-on-posture "$FAIL_ON_POSTURE")
          elif [ "$POSTURE" = "true" ] || [ "$FAIL_ON_DIVERGENCE" = "true" ]; then
            args+=(--posture)
          fi
          # Cross-document posture: the documents disagreeing with each other,
          # which is a different question from any one of them being low.
          if [ "$FAIL_ON_DIVERGENCE" = "true" ]; then
            args+=(--fail-on-divergence)
          fi
        fi
        # Cross-document checks read the inputs as one bundle. analyze-only, and
        # asserted rather than inferred: a directory of unrelated documents
        # produces hundreds of true-but-meaningless conflicts.
        if [ "$CMD" = "analyze" ]; then
          if [ -n "$FAIL_ON_CONSISTENCY" ]; then
            args+=(--fail-on-consistency "$FAIL_ON_CONSISTENCY")
          elif [ "$CONSISTENCY" = "only" ]; then
            args+=(--consistency-only)
          elif [ "$CONSISTENCY" = "true" ]; then
            args+=(--consistency)
          fi
        fi
        # Production QA over a production SET. A distinct analyze mode rather
        # than a per-document flag: `--fail-on-production-gap` implies
        # `--production-qa`, so the gate alone is enough. The CLI flag's own
        # comment says it exists "for a CI check before a production goes out" —
        # and the Action, which is that CI check, could not switch it on.
        if [ "$CMD" = "analyze" ]; then
          if [ "${FAIL_ON_PRODUCTION_GAP:-}" = "true" ]; then
            args+=(--production-qa --fail-on-production-gap)
          elif [ "${PRODUCTION_QA:-}" = "true" ]; then
            args+=(--production-qa)
          fi
        fi
        echo "vaulytica ${args[*]}"
        # The human stream — per-document counts, the honesty caveats, the
        # cross-document summary — is what a reader of this job needs, and it
        # goes to STDERR whenever a machine format is selected (the Action's
        # default is `sarif`). In GitHub that lands in the raw step log, which
        # is collapsed by default and scrolls; the job summary is the surface a
        # reader actually sees. So capture stderr, replay it, and put it there.
        #
        # stdout is deliberately untouched: with a machine format it carries the
        # artifact itself, and teeing it would both break the CLI's stream
        # contract and drop a SARIF blob into the summary.
        log="$(mktemp)"
        status=0
        node "$VAULYTICA_BIN" "${args[@]}" 2>"$log" || status=$?
        cat "$log" >&2
        # The content check skips an empty log, which is the non-machine-format
        # case: there the tool writes those same lines to stdout, where they are
        # already in the step log and in `--out` if the caller asked for it. An
        # empty "Vaulytica" section on the run page would read as "it found
        # nothing".
        #
        # It tests for a non-whitespace CHARACTER rather than for a non-zero
        # size: a log holding just a newline is not output, and `-s` would have
        # rendered it as an empty fenced block under a heading.
        # `${SUMMARY:-}` rather than `$SUMMARY`: the step runs under `set -u`,
        # and a caller invoking this script without the input exported (as the
        # argv test does) would abort on an unbound variable rather than fall
        # back to the declared default.
        if [ "${SUMMARY:-}" != "false" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ] \
          && grep -q '[^[:space:]]' "$log"; then
          {
            echo "## Vaulytica"
            echo
            echo "\`vaulytica ${args[*]}\`"
            echo
            # 1 and 2 are different answers and a reader acts on them
            # differently. `2` is a gate the caller asked for, tripping on a
            # document the tool read fine. `1` is the tool not doing the job as
            # asked — and since 9.666.0 that includes a run that DID produce a
            # report, for the inputs it could read, while naming the ones it
            # could not. "a gate tripped, or the run errored" described neither
            # of those, so a reader who saw exit 1 had no reason to look for the
            # report that exists.
            if [ "$status" -eq 0 ]; then
              echo "**Passed** — no \`fail-on\` gate tripped."
            elif [ "$status" -eq 2 ]; then
              echo "**Failed (exit 2)** — a \`fail-on\` gate tripped. The lines below say which."
            else
              echo "**Failed (exit $status)** — no \`fail-on\` gate tripped; the run could not be completed as asked. If an input could not be READ, the lines below name it and the report covers the rest."
            fi
            echo
            echo '```'
            # A job summary is capped at 1 MiB. Bound it well under that — and
            # SAY when the bound bit, because a silently truncated log reads as
            # the whole run.
            # Node's own runtime warnings are not the tool's output, and two
            # lines of them at the top of a user-facing summary is what a
            # reader sees first. Dropped from the SUMMARY only — `cat "$log"
            # >&2` above already put every byte in the step log, so nothing is
            # hidden, this is the curated view. The pattern is Node's exact
            # format (`(node:1234) ExperimentalWarning:` and the paired
            # `(Use \`node --trace-warnings ...\`)` line), which Vaulytica
            # itself never emits.
            clean="$(mktemp)"
            grep -vE '^\(node:[0-9]+\) [A-Za-z]*Warning:|^\(Use `node --trace-warnings' "$log" > "$clean" || true
            bytes=$(wc -c < "$clean" | tr -d ' ')
            if [ "$bytes" -gt 60000 ]; then
              echo "[earlier output omitted — showing the last 60,000 of $bytes characters; the full log is in the step above]"
              tail -c 60000 "$clean"
            else
              cat "$clean"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
