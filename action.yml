name: "Vaulytica contract review"
description: "Deterministic, no-AI legal-document linter — analyze or version-compare contracts in CI and gate on findings (SARIF, redline)."
author: "clay-good"
branding:
  icon: "shield"
  color: "green"

inputs:
  command:
    description: "Which subcommand to run: analyze | compare."
    required: false
    default: "analyze"
  files:
    description: "analyze: a path, single-segment glob, or directory of documents (.pdf/.docx/.txt/.md)."
    required: false
    default: ""
  base:
    description: "compare: the base document."
    required: false
    default: ""
  revised:
    description: "compare: the revised document."
    required: false
    default: ""
  redline:
    description: "compare: one Word redline (.docx) in place of base and revised — its draft with every tracked change rejected is compared against every change accepted, so the gate fails on what the markup introduced."
    required: false
    default: ""
  format:
    description: "Output format(s). analyze: comma list of json,sarif,html,md,csv,docx,docx-comments,bundle-json,bundle-docx,bundle-zip,checklist-md,checklist-csv,dates-md,dates-ics,obligations-csv,deadlines-ics,posture-md,posture-csv,posture-sheet,definitions-csv,brief-json,triage-md,triage-json,abstract-json,abstract-csv,inventory-csv,inventory-json (default sarif) — the checklist-* formats need the closing checklist and the dates-* formats need the critical-dates register, both of which the CLI computes only when asserted. `docx` is the full attorney-facing report and `docx-comments` a commented copy of the input; both are binary and need `out-dir`. The `bundle-*` values write one consolidated artifact for the whole set (implies the cross-document run, needs 2+ inputs and `out-dir`). compare: json|markdown (default markdown). Leave empty to take each command's default."
    required: false
    default: ""
  fail-on:
    description: "Exit non-zero when a finding (analyze) — or an introduced finding (compare) — is at or above this severity: critical|warning|info. Empty = never fail."
    required: false
    default: ""
  playbook:
    description: "Force a specific playbook id instead of auto-matching."
    required: false
    default: ""
  out:
    description: "analyze only: directory to write one file per document per format (e.g. for SARIF upload)."
    required: false
    default: ""
  consistency:
    description: "analyze only: set to true to read two or more inputs AS A BUNDLE and run the cross-document consistency checks. A directory is not a bundle — assert this only when the documents belong to the same deal. Set to 'only' to report the bundle and nothing else (no per-document report, and no 'out' needed)."
    required: false
    default: ""
  delivery:
    description: "analyze only: set to true to run the pre-disclosure scan (HANDOFF-001..005) over the uploaded container — tracked changes, comments, hidden content, authoring metadata, and sensitive-data patterns."
    required: false
    default: ""
  fail-on-delivery:
    description: "analyze only: exit non-zero when a PRE-DISCLOSURE finding is at or above this severity: critical|warning|info. Implies delivery. Separate from fail-on, which reads the run — the delivery scan sits outside it. Empty = never fail."
    required: false
    default: ""
  playbook-file:
    description: "analyze only: path to a custom playbook JSON in your repository (your team's positions), loaded instead of relying on the built-in match alone."
    required: false
    default: ""
  posture:
    description: "analyze only: set to true to classify the draft against the playbook-file's negotiation_positions. Requires playbook-file."
    required: false
    default: ""
  fail-on-posture:
    description: "analyze only: exit non-zero when any posture dimension sits at or below this rung: ideal|acceptable|below-acceptable. Implies posture. A not-stated dimension never trips it. Empty = never fail."
    required: false
    default: ""
  fail-on-divergence:
    description: "analyze only: set to true to exit non-zero when a posture front diverges across the bundle — the documents disagree with each other on a rung. Requires posture (and so playbook-file), and two or more inputs."
    required: false
    default: ""
  summary:
    description: "Write a GitHub job summary with the run's counts, caveats and gate result. Default true. The tool's human output is what a reader needs and it lands in the raw step log, which is collapsed by default — this puts it on the run page. Set false to keep the summary empty."
    required: false
    default: "true"
  fail-on-consistency:
    description: "analyze only: exit non-zero when a CROSS-DOCUMENT finding is at or above this severity: critical|warning|info. Implies consistency. Separate from fail-on, which scores each document alone. Empty = never fail."
    required: false
    default: ""
  production-qa:
    description: "analyze only: run production QA over a document production SET (a directory or .zip given in 'files') instead of per-document analysis — Bates sequence + privilege-log reconciliation against the single .csv member, plus a pre-production handoff sweep. Emits a JSON report with its own production_qa_hash."
    required: false
    default: "false"
  fail-on-production-gap:
    description: "analyze only: exit non-zero when production QA finds a Bates sequence gap. Implies production-qa. The CLI flag exists FOR this check — 'a CI check before a production goes out' — and until 9.631.0 the Action could not switch it on."
    required: false
    default: "false"

  # The assertions. Each switches on a body of rules that no document's own
  # text can be read to request: nothing in a lease says which state's law a
  # filer must satisfy, so the engine never guesses and the caller asserts.
  # Until 9.1002.0 a CI consumer could not assert any of them.
  state:
    description: "analyze only: a two-letter state code (e.g. ca, ny, tx). Switches on that state's overlay rules — the statutory requirements that apply only there. Asserted, never inferred: nothing in a document says which state's law governs its form."
    required: false
    default: ""
  regime:
    description: "analyze only: comma list of privacy regimes to hold the documents to: ccpa,gdpr,gdpr-13,gdpr-14,co,va,tx,or. Asserted — which regimes reach a controller is a fact about the business, not about the text."
    required: false
    default: ""
  readability:
    description: "analyze only: a readability standard id (see docs/readability.md — fl, me, mi, mn, nv, oh, or, mt, wv, nd, ne, dc, ok). Holds the document to that state's minimum Flesch reading ease and its table-of-contents requirement. Without it the score is reported and no finding fires."
    required: false
    default: ""
  estate-checks:
    description: "analyze only: set to true to run the estate-formalities checks (execution requirements for wills and trusts) in addition to the ordinary rules."
    required: false
    default: ""
  sec-exhibit:
    description: "analyze only: set to true to add the SEC exhibit checks to the pre-disclosure scan — redaction markers without the first-page omission statement 17 C.F.R. § 229.601(b)(10)(iv) requires. Implies delivery."
    required: false
    default: ""
  court:
    description: "analyze only: a filing-format profile id (frap-default, ca9-appellate, cal-rules-8.204). Checks the brief against that court's length, type and cover requirements."
    required: false
    default: ""
  reply:
    description: "analyze only: set to true to read the brief as a REPLY rather than a principal brief, which the court profiles hold to a shorter length. Requires court."
    required: false
    default: ""
  deadline-profile:
    description: "analyze only: a deadline-computation profile id (frcp-6, cal-ccp-12) for the dates the documents set."
    required: false
    default: ""
  service-method:
    description: "analyze only: the method service was made by, which the deadline profile adds days for. Requires deadline-profile."
    required: false
    default: ""
  critical-dates:
    description: "analyze only: set to true to compute the critical-dates register (every dated obligation and its anchor). Needed by the dates-md, dates-ics and deadlines-ics formats."
    required: false
    default: ""
  checklist:
    description: "analyze only: set to true to compute the closing checklist. Needed by the checklist-md and checklist-csv formats."
    required: false
    default: ""
  definitions:
    description: "analyze only: set to true to compute the defined-terms report. Needed by the definitions-csv format."
    required: false
    default: ""
  certificate:
    description: "analyze only: set to true to write the verification certificate — the .docx that records what was run, against which authorities, and the hashes a later verify re-derives. Binary output, so it requires out."
    required: false
    default: ""
  role:
    description: "analyze only: which side of the deal the playbook speaks for, when its negotiation_positions are written per role. Requires playbook-file."
    required: false
    default: ""
  deal-value:
    description: "analyze only: the deal's value in dollars, which a playbook's positions may scale against (e.g. a liability cap as a multiple). Requires playbook-file."
    required: false
    default: ""
  as-text:
    description: "analyze only: set to true to read every input as UTF-8 text whatever its extension, instead of by format. For a repository that keeps contracts under an extension this tool does not recognize."
    required: false
    default: ""

  # The regression gate: this round's posture against the last one. The CI
  # question "did this PR give ground?" needed --baseline, and no input reached it.
  baseline:
    description: "analyze only: the previous round's documents (path, glob or directory) to score this round against, reporting each position that moved. Requires posture (and so playbook-file). Mutually exclusive with baseline-coherence."
    required: false
    default: ""
  baseline-coherence:
    description: "analyze only: a coherence.json emitted by an earlier run, as the baseline, instead of re-analyzing its documents. Requires posture. Mutually exclusive with baseline."
    required: false
    default: ""
  fail-on-coherence-regression:
    description: "analyze only: set to true to exit non-zero when a posture position moved against you since the baseline. Requires baseline or baseline-coherence."
    required: false
    default: ""
  emit-coherence:
    description: "analyze only: a path to write this round's coherence.json to, for a later run to use as its baseline-coherence. Requires posture."
    required: false
    default: ""
  emit-consistency:
    description: "analyze only: a path to write the cross-document consistency report to as JSON. Implies the bundle run."
    required: false
    default: ""

  # compare's remaining modes and gates.
  executed:
    description: "compare only: set to true to read 'base' as the final draft and 'revised' as its SIGNED copy, reporting what differs once execution's own fills (signature lines, dates written into blanks, execution legends) are set aside, with a verdict."
    required: false
    default: ""
  executed-set:
    description: "compare only: set to true to read 'base' and 'revised' as two FOLDERS — the finals and the signed copies — pairing each by the document's own title. Unpaired files and tied titles are listed, never guessed. Conformity only: fail-on, posture and fail-on-regression do not apply."
    required: false
    default: ""
  fail-on-nonconformity:
    description: "compare only: set to true to exit non-zero when a signed copy differs from its final outside the execution allowance. Requires executed or executed-set."
    required: false
    default: ""
  confirm-pairing:
    description: "compare only: set to true to confirm that two documents of different families are meant to be compared. Without it a cross-family compare refuses rather than producing a diff of two unrelated documents."
    required: false
    default: ""
  fail-on-regression:
    description: "compare only: set to true to exit non-zero when a posture position moved against you between the two versions. Requires posture (and so playbook-file)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Install only the engine's runtime deps in the action's own checkout. `tsx`
    # is a runtime dependency, so the CLI runs from TypeScript source with no
    # build step. `--omit=dev` skips the heavy dev-only deps (the `sharp` native
    # build, Playwright) while still running `esbuild`'s postinstall — tsx needs
    # esbuild, and `--ignore-scripts` would leave its binary unconfigured.
    - name: Install Vaulytica
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund

    # Run against the consumer's checked-out files (GITHUB_WORKSPACE). The DKB
    # ships with the tool, so analysis opens no socket — nothing leaves the
    # runner. The CLI's own exit code (2 = --fail-on breach) propagates and
    # fails the step.
    - name: Run Vaulytica
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        VAULYTICA_BIN: ${{ github.action_path }}/bin/vaulytica.mjs
        CMD: ${{ inputs.command }}
        FILES: ${{ inputs.files }}
        BASE: ${{ inputs.base }}
        REVISED: ${{ inputs.revised }}
        REDLINE: ${{ inputs.redline }}
        FORMAT: ${{ inputs.format }}
        FAIL_ON: ${{ inputs.fail-on }}
        PLAYBOOK: ${{ inputs.playbook }}
        OUT: ${{ inputs.out }}
        CONSISTENCY: ${{ inputs.consistency }}
        DELIVERY: ${{ inputs.delivery }}
        FAIL_ON_DELIVERY: ${{ inputs.fail-on-delivery }}
        PLAYBOOK_FILE: ${{ inputs.playbook-file }}
        POSTURE: ${{ inputs.posture }}
        FAIL_ON_POSTURE: ${{ inputs.fail-on-posture }}
        FAIL_ON_DIVERGENCE: ${{ inputs.fail-on-divergence }}
        FAIL_ON_CONSISTENCY: ${{ inputs.fail-on-consistency }}
        SUMMARY: ${{ inputs.summary }}
        PRODUCTION_QA: ${{ inputs.production-qa }}
        FAIL_ON_PRODUCTION_GAP: ${{ inputs.fail-on-production-gap }}
        STATE: ${{ inputs.state }}
        REGIME: ${{ inputs.regime }}
        READABILITY: ${{ inputs.readability }}
        ESTATE_CHECKS: ${{ inputs.estate-checks }}
        SEC_EXHIBIT: ${{ inputs.sec-exhibit }}
        COURT: ${{ inputs.court }}
        REPLY: ${{ inputs.reply }}
        DEADLINE_PROFILE: ${{ inputs.deadline-profile }}
        SERVICE_METHOD: ${{ inputs.service-method }}
        CRITICAL_DATES: ${{ inputs.critical-dates }}
        CHECKLIST: ${{ inputs.checklist }}
        DEFINITIONS: ${{ inputs.definitions }}
        CERTIFICATE: ${{ inputs.certificate }}
        ROLE: ${{ inputs.role }}
        DEAL_VALUE: ${{ inputs.deal-value }}
        AS_TEXT: ${{ inputs.as-text }}
        BASELINE: ${{ inputs.baseline }}
        BASELINE_COHERENCE: ${{ inputs.baseline-coherence }}
        FAIL_ON_COHERENCE_REGRESSION: ${{ inputs.fail-on-coherence-regression }}
        EMIT_COHERENCE: ${{ inputs.emit-coherence }}
        EMIT_CONSISTENCY: ${{ inputs.emit-consistency }}
        EXECUTED: ${{ inputs.executed }}
        EXECUTED_SET: ${{ inputs.executed-set }}
        FAIL_ON_NONCONFORMITY: ${{ inputs.fail-on-nonconformity }}
        CONFIRM_PAIRING: ${{ inputs.confirm-pairing }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        set -euo pipefail
        args=("$CMD")
        if [ "$CMD" = "compare" ]; then
          if [ -n "${REDLINE:-}" ]; then
            if [ -n "$BASE" ] || [ -n "$REVISED" ]; then
              echo "::error::compare takes either 'redline' or 'base' and 'revised', not both" >&2
              exit 1
            fi
            args+=(--redline "$REDLINE")
          elif [ -z "$BASE" ] || [ -z "$REVISED" ]; then
            echo "::error::compare requires both 'base' and 'revised' inputs, or 'redline'" >&2
            exit 1
          else
            # The closing-set modes read the same two slots as something else:
            # `executed` makes them a final and its signed copy, `executed-set`
            # two folders of them. The flag goes BEFORE the positionals, which
            # is the order the CLI's usage prints and the parser expects.
            if [ "${EXECUTED_SET:-}" = "true" ] && [ "${EXECUTED:-}" = "true" ]; then
              echo "::error::'executed' and 'executed-set' are different modes; set one" >&2
              exit 1
            fi
            if [ "${EXECUTED_SET:-}" = "true" ]; then
              args+=(--executed-set)
            elif [ "${EXECUTED:-}" = "true" ]; then
              args+=(--executed)
            fi
            args+=("$BASE" "$REVISED")
          fi
          # Conformity's own gate. It needs one of the two modes above, and the
          # CLI says so rather than guessing, so the input is refused on its own
          # here instead of reaching the binary as an argument error.
          if [ "${FAIL_ON_NONCONFORMITY:-}" = "true" ]; then
            if [ "${EXECUTED:-}" != "true" ] && [ "${EXECUTED_SET:-}" != "true" ]; then
              echo "::error::'fail-on-nonconformity' requires 'executed' or 'executed-set'" >&2
              exit 1
            fi
            args+=(--fail-on-nonconformity)
          fi
          # Two documents of different families: asserted, never assumed.
          [ "${CONFIRM_PAIRING:-}" = "true" ] && args+=(--confirm-pairing)
          # `--executed-set` checks conformity and nothing else — the CLI
          # rejects --posture, --fail-on and --fail-on-regression beside it. Say
          # so here, naming the input, rather than letting the step die on an
          # argument error that names a flag the caller never typed.
          if [ "${EXECUTED_SET:-}" = "true" ]; then
            for bad in FAIL_ON:fail-on POSTURE:posture FAIL_ON_REGRESSION:fail-on-regression; do
              name="${bad%%:*}"
              value="${!name:-}"
              if [ -n "$value" ] && [ "$value" != "false" ]; then
                echo "::error::'executed-set' checks conformity only; '${bad#*:}' does not apply" >&2
                exit 1
              fi
            done
          fi
          # The team's own ladder, on compare as on analyze: `--playbook-file`
          # was declared and appended only under analyze, so a compare run
          # scored against the built-in match however the input was set.
          if [ -n "${PLAYBOOK_FILE:-}" ]; then
            args+=(--playbook-file "$PLAYBOOK_FILE")
            # Did the revision give ground? Needs the ladder to score against.
            if [ "${FAIL_ON_REGRESSION:-}" = "true" ]; then
              args+=(--posture --fail-on-regression)
            elif [ "${POSTURE:-}" = "true" ]; then
              args+=(--posture)
            fi
          elif [ "${FAIL_ON_REGRESSION:-}" = "true" ]; then
            echo "::error::'fail-on-regression' requires 'playbook-file'" >&2
            exit 1
          fi
        else
          if [ -z "$FILES" ]; then
            echo "::error::analyze requires the 'files' input" >&2
            exit 1
          fi
          args+=("$FILES")
        fi
        # `sarif` is the analyze-only default (it is what gets uploaded to code
        # scanning); compare accepts json|markdown and rejects sarif outright,
        # so passing the default through to compare failed every run. Leave the
        # flag off for compare unless the caller asked for a format explicitly,
        # letting each subcommand apply its own default.
        if [ -z "$FORMAT" ] && [ "$CMD" != "compare" ]; then
          FORMAT="sarif"
        fi
        [ -n "$FORMAT" ] && args+=(--format "$FORMAT")
        [ -n "$PLAYBOOK" ] && args+=(--playbook "$PLAYBOOK")
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        if [ "$CMD" = "analyze" ] && [ -n "$OUT" ]; then
          args+=(--out "$OUT")
        fi
        # The pre-disclosure scan and its gate. `--fail-on-delivery` implies the
        # scan, so the flag is enough on its own; `--fail-on` does NOT gate on
        # these findings, which is why the gate has a flag of its own.
        if [ "$CMD" = "analyze" ]; then
          if [ -n "$FAIL_ON_DELIVERY" ]; then
            args+=(--delivery --fail-on-delivery "$FAIL_ON_DELIVERY")
          elif [ "$DELIVERY" = "true" ] || [ "${SEC_EXHIBIT:-}" = "true" ]; then
            args+=(--delivery)
          fi
          # The SEC exhibit half of the scan: redaction markers with no
          # first-page omission statement. It is a sub-check of the delivery
          # scan, so it turns the scan on rather than failing beside it.
          [ "${SEC_EXHIBIT:-}" = "true" ] && args+=(--sec-exhibit)
        fi
        # The assertions. Each names a body of law the caller says applies; the
        # engine never infers one, so an unset input means those rules do not
        # run. All analyze-only, and each independent of the others.
        if [ "$CMD" = "analyze" ]; then
          [ -n "${STATE:-}" ] && args+=(--state "$STATE")
          [ -n "${REGIME:-}" ] && args+=(--regime "$REGIME")
          [ -n "${READABILITY:-}" ] && args+=(--readability "$READABILITY")
          [ "${ESTATE_CHECKS:-}" = "true" ] && args+=(--estate-checks)
          [ "${AS_TEXT:-}" = "true" ] && args+=(--as-text)
          # A court profile, and the shorter length a reply is held to. `--reply`
          # means nothing on its own, so it goes on only with the profile.
          if [ -n "${COURT:-}" ]; then
            args+=(--court "$COURT")
            [ "${REPLY:-}" = "true" ] && args+=(--reply)
          elif [ "${REPLY:-}" = "true" ]; then
            echo "::error::'reply' requires 'court'" >&2
            exit 1
          fi
          # The deadline profile, and the method service was made by, which only
          # that profile adds days for.
          if [ -n "${DEADLINE_PROFILE:-}" ]; then
            args+=(--deadline-profile "$DEADLINE_PROFILE")
            [ -n "${SERVICE_METHOD:-}" ] && args+=(--service-method "$SERVICE_METHOD")
          elif [ -n "${SERVICE_METHOD:-}" ]; then
            echo "::error::'service-method' requires 'deadline-profile'" >&2
            exit 1
          fi
          # The derived registers. Each is computed only when asserted, and the
          # formats that print them are inert without it — a workflow asking for
          # `dates-ics` and not `critical-dates` got an empty calendar.
          [ "${CRITICAL_DATES:-}" = "true" ] && args+=(--critical-dates)
          [ "${CHECKLIST:-}" = "true" ] && args+=(--checklist)
          [ "${DEFINITIONS:-}" = "true" ] && args+=(--definitions)
          # The verification certificate is a .docx, so it needs somewhere to go.
          if [ "${CERTIFICATE:-}" = "true" ]; then
            if [ -z "${OUT:-}" ]; then
              echo "::error::'certificate' writes a .docx and requires 'out'" >&2
              exit 1
            fi
            args+=(--certificate)
          fi
          [ -n "${EMIT_CONSISTENCY:-}" ] && args+=(--emit-consistency "$EMIT_CONSISTENCY")
        fi
        # The team's own ladder. --posture needs the playbook file to score
        # against, so the flags only go on together.
        if [ "$CMD" = "analyze" ] && [ -n "$PLAYBOOK_FILE" ]; then
          args+=(--playbook-file "$PLAYBOOK_FILE")
          if [ -n "$FAIL_ON_POSTURE" ]; then
            args+=(--posture --fail-on-posture "$FAIL_ON_POSTURE")
          elif [ "$POSTURE" = "true" ] || [ "$FAIL_ON_DIVERGENCE" = "true" ]; then
            args+=(--posture)
          fi
          # Cross-document posture: the documents disagreeing with each other,
          # which is a different question from any one of them being low.
          if [ "$FAIL_ON_DIVERGENCE" = "true" ]; then
            args+=(--fail-on-divergence)
          fi
          # Which side the ladder speaks for, and the figure its positions scale
          # against. Both require the playbook file, which is why they sit here.
          [ -n "${ROLE:-}" ] && args+=(--role "$ROLE")
          [ -n "${DEAL_VALUE:-}" ] && args+=(--deal-value "$DEAL_VALUE")
          # This round against the last one — the question a pull request asks.
          # Both baseline sources require --posture (which the branch above has
          # already added when asked) and exclude each other.
          if [ -n "${BASELINE:-}" ] && [ -n "${BASELINE_COHERENCE:-}" ]; then
            echo "::error::set 'baseline' or 'baseline-coherence', not both" >&2
            exit 1
          fi
          if [ -n "${BASELINE:-}" ] || [ -n "${BASELINE_COHERENCE:-}" ] \
            || [ -n "${EMIT_COHERENCE:-}" ]; then
            # --posture is what produces the coherence these read and write, and
            # the CLI refuses all three without it.
            case " ${args[*]} " in
              *" --posture "*) ;;
              *) args+=(--posture) ;;
            esac
          fi
          [ -n "${BASELINE:-}" ] && args+=(--baseline "$BASELINE")
          [ -n "${BASELINE_COHERENCE:-}" ] && args+=(--baseline-coherence "$BASELINE_COHERENCE")
          [ -n "${EMIT_COHERENCE:-}" ] && args+=(--emit-coherence "$EMIT_COHERENCE")
          if [ "${FAIL_ON_COHERENCE_REGRESSION:-}" = "true" ]; then
            if [ -z "${BASELINE:-}" ] && [ -z "${BASELINE_COHERENCE:-}" ]; then
              echo "::error::'fail-on-coherence-regression' requires 'baseline' or 'baseline-coherence'" >&2
              exit 1
            fi
            args+=(--fail-on-coherence-regression)
          fi
        elif [ "$CMD" = "analyze" ] && { [ -n "${ROLE:-}" ] || [ -n "${DEAL_VALUE:-}" ] \
          || [ -n "${BASELINE:-}" ] || [ -n "${BASELINE_COHERENCE:-}" ] \
          || [ -n "${EMIT_COHERENCE:-}" ] \
          || [ "${FAIL_ON_COHERENCE_REGRESSION:-}" = "true" ]; }; then
          # All six score against the team's own ladder, and the CLI refuses
          # each one without it. Name the missing input rather than letting the
          # binary name a flag the caller never typed.
          echo "::error::'role', 'deal-value', 'baseline', 'baseline-coherence', 'emit-coherence' and 'fail-on-coherence-regression' all require 'playbook-file'" >&2
          exit 1
        fi
        # Cross-document checks read the inputs as one bundle. analyze-only, and
        # asserted rather than inferred: a directory of unrelated documents
        # produces hundreds of true-but-meaningless conflicts.
        if [ "$CMD" = "analyze" ]; then
          if [ -n "$FAIL_ON_CONSISTENCY" ]; then
            args+=(--fail-on-consistency "$FAIL_ON_CONSISTENCY")
          elif [ "$CONSISTENCY" = "only" ]; then
            args+=(--consistency-only)
          elif [ "$CONSISTENCY" = "true" ]; then
            args+=(--consistency)
          fi
        fi
        # Production QA over a production SET. A distinct analyze mode rather
        # than a per-document flag: `--fail-on-production-gap` implies
        # `--production-qa`, so the gate alone is enough. The CLI flag's own
        # comment says it exists "for a CI check before a production goes out" —
        # and the Action, which is that CI check, could not switch it on.
        if [ "$CMD" = "analyze" ]; then
          if [ "${FAIL_ON_PRODUCTION_GAP:-}" = "true" ]; then
            args+=(--production-qa --fail-on-production-gap)
          elif [ "${PRODUCTION_QA:-}" = "true" ]; then
            args+=(--production-qa)
          fi
        fi
        echo "vaulytica ${args[*]}"
        # The human stream — per-document counts, the honesty caveats, the
        # cross-document summary — is what a reader of this job needs, and it
        # goes to STDERR whenever a machine format is selected (the Action's
        # default is `sarif`). In GitHub that lands in the raw step log, which
        # is collapsed by default and scrolls; the job summary is the surface a
        # reader actually sees. So capture stderr, replay it, and put it there.
        #
        # stdout is deliberately untouched: with a machine format it carries the
        # artifact itself, and teeing it would both break the CLI's stream
        # contract and drop a SARIF blob into the summary.
        log="$(mktemp)"
        status=0
        node "$VAULYTICA_BIN" "${args[@]}" 2>"$log" || status=$?
        cat "$log" >&2
        # The content check skips an empty log, which is the non-machine-format
        # case: there the tool writes those same lines to stdout, where they are
        # already in the step log and in `--out` if the caller asked for it. An
        # empty "Vaulytica" section on the run page would read as "it found
        # nothing".
        #
        # It tests for a non-whitespace CHARACTER rather than for a non-zero
        # size: a log holding just a newline is not output, and `-s` would have
        # rendered it as an empty fenced block under a heading.
        # `${SUMMARY:-}` rather than `$SUMMARY`: the step runs under `set -u`,
        # and a caller invoking this script without the input exported (as the
        # argv test does) would abort on an unbound variable rather than fall
        # back to the declared default.
        if [ "${SUMMARY:-}" != "false" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ] \
          && grep -q '[^[:space:]]' "$log"; then
          {
            # The folder page first, when the run wrote one (`format` includes
            # triage-md, with `out`): which documents need a person first is
            # what a reader of this job wants before any log. Its links point
            # at report files beside it, which a job summary cannot serve, so
            # they are shown as plain paths here.
            if [ -n "${OUT:-}" ] && [ -f "$OUT/TRIAGE.md" ]; then
              head -c 60000 "$OUT/TRIAGE.md" | sed -E 's/\[([^]]+)\]\([^)]*\)/\1/g'
              echo
            fi
            echo "## Vaulytica"
            echo
            echo "\`vaulytica ${args[*]}\`"
            echo
            # 1 and 2 are different answers and a reader acts on them
            # differently. `2` is a gate the caller asked for, tripping on a
            # document the tool read fine. `1` is the tool not doing the job as
            # asked — and since 9.666.0 that includes a run that DID produce a
            # report, for the inputs it could read, while naming the ones it
            # could not. "a gate tripped, or the run errored" described neither
            # of those, so a reader who saw exit 1 had no reason to look for the
            # report that exists.
            if [ "$status" -eq 0 ]; then
              echo "**Passed** — no \`fail-on\` gate tripped."
            elif [ "$status" -eq 2 ]; then
              echo "**Failed (exit 2)** — a \`fail-on\` gate tripped. The lines below say which."
            else
              echo "**Failed (exit $status)** — no \`fail-on\` gate tripped; the run could not be completed as asked. If an input could not be READ, the lines below name it and the report covers the rest."
            fi
            echo
            echo '```'
            # A job summary is capped at 1 MiB. Bound it well under that — and
            # SAY when the bound bit, because a silently truncated log reads as
            # the whole run.
            # Node's own runtime warnings are not the tool's output, and two
            # lines of them at the top of a user-facing summary is what a
            # reader sees first. Dropped from the SUMMARY only — `cat "$log"
            # >&2` above already put every byte in the step log, so nothing is
            # hidden, this is the curated view. The pattern is Node's exact
            # format (`(node:1234) ExperimentalWarning:` and the paired
            # `(Use \`node --trace-warnings ...\`)` line), which Vaulytica
            # itself never emits.
            clean="$(mktemp)"
            grep -vE '^\(node:[0-9]+\) [A-Za-z]*Warning:|^\(Use `node --trace-warnings' "$log" > "$clean" || true
            bytes=$(wc -c < "$clean" | tr -d ' ')
            if [ "$bytes" -gt 60000 ]; then
              echo "[earlier output omitted — showing the last 60,000 of $bytes characters; the full log is in the step above]"
              tail -c 60000 "$clean"
            else
              cat "$clean"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
