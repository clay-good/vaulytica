name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 20 until 9.511.0. The suite got structurally slower in 9.508.0 — the
    # family matcher folds the document properly now instead of running a
    # substring test, which is what removed 515 spurious critical findings —
    # and this job settled at 17m29s against the 20-minute budget: green, but
    # 87% of it, which flakes on a slow runner. Raised to keep ~40% headroom.
    #
    # 🚨 A job over budget is reported by GitHub as `cancelled`, not `failed`,
    # and that is indistinguishable at a glance from one superseded by a later
    # push. Diagnose by DURATION (createdAt -> updatedAt vs this number), never
    # by status. Two releases shipped with this job red because it looked like
    # a supersede.
    timeout-minutes: 28
    # Exposing the secret as a job-level env var lets `if:` skip the
    # deploy + e2e steps gracefully on forks / environments where the
    # Cloudflare credentials have not been configured. The build/test
    # gate still runs (and is also covered by ci.yml).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vaulytica --branch=main

      - name: Install Playwright (chromium)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run e2e:install

      - name: Post-deploy smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          VAULYTICA_E2E_BASE_URL: https://vaulytica.com
        run: npm run e2e

      - name: "Note: deploy skipped"
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN not set — deploy + e2e skipped."
          echo "Build artifacts in dist/ are still produced and validated."

      - name: Upload Playwright traces on failure
        if: failure() && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
