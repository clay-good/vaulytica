name: Test matrix (cross-OS determinism)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Runs the full lint + typecheck + test suite on three operating
    # systems. The determinism guard (`tests/integration/determinism-
    # guard.test.ts`) + golden-output test together enforce that every
    # fixture produces the same `result_hash` on Ubuntu, macOS, and
    # Windows. Spec §27 row (c): cross-machine determinism.
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A job that runs OUT OF TIME is reported as `cancelled`, which at a glance
    # is indistinguishable from one superseded by a later push — so this matrix
    # sat "cancelled" on four consecutive commits while CI, Deploy and
    # Lighthouse went green, and the cross-OS determinism check (the one that
    # catches the Windows-only path-separator class) quietly stopped running.
    # The suite had simply outgrown a 15-minute budget: the last successful run
    # took 14m51s. Raised with headroom rather than to the edge, and paired with
    # a 45% cut to the heaviest file (`format-invariance` now analyzes the clean
    # corpus once instead of once per transform: 191s -> 106s).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
    env:
      VAULYTICA_SKIP_BUILD_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests (with SRI build skipped)
        run: npm test
