name: Mutation testing

# spec-v7 Steps 123–124. Mutation testing measures the suite's fault-detection
# power (would a test CATCH a bug here?), not just line coverage. Stryker runs
# the test suite once per mutant, so it is slow — it runs on a weekly schedule
# and on demand, NEVER on the per-push critical path (that stays ci.yml's
# typecheck + lint + coverage + build). The regression-only `break` threshold in
# stryker.config.json fails this job if the score drops below the floor — and
# ONLY that: a run the runner kills before it reports is annotated, not failed,
# because a red job nobody can act on is a red job nobody looks at.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  # Sharded on 2026-10-05. One job ran every module: 48 min (08-27), 64 (08-31),
  # 95 (09-07), and then, after `obligations.ts` tripled in size, every run from
  # 09-14 to 10-05 hit the 180-minute limit and reported `cancelled` — four weeks
  # with no score. Each shard mutates part of the scope; the `score` job pools
  # every shard's report (tools/mutation/aggregate.ts) and applies the `break`
  # floor to the whole, because the floor was measured over the whole.
  # tests/integration/mutation-scope.test.ts asserts the shards cover
  # stryker.config.json's `mutate` list exactly, once each.
  mutation:
    runs-on: ubuntu-latest
    # Bounded so a hang reports as a timeout rather than running to the
    # six-hour default. Over-budget reports as `cancelled`, which reads like a
    # supersede — the trap `test-matrix.yml` documents. Each shard is a fifth of
    # a run that took 95 minutes whole, so 180 is headroom, not a target.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: obligations
            mutate: src/extract/obligations.ts
          - name: parties
            mutate: src/extract/parties.ts,src/extract/sections.ts
          - name: report
            mutate: src/report/exports.ts,src/report/critical-dates.ts
          - name: jurisdictions-crossrefs
            mutate: src/extract/jurisdictions.ts,src/extract/crossrefs.ts
          - name: amounts-dates-delivery
            mutate: src/extract/amounts.ts,src/extract/dates.ts,src/delivery/sensitive.ts,src/delivery/mask.ts,src/production/privilege-log.ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Stryker on this shard
        # The shard config is stryker.config.json with this shard's `mutate`
        # list and NO `break`: a shard's own score is not comparable to a floor
        # measured over every module, so only the `score` job decides.
        #
        # A signal death — 130 (SIGINT), 137 (SIGKILL, the shape an OOM takes),
        # 143 (SIGTERM) — is the runner going away and says nothing about the
        # suite (2026-08-24: SIGTERM at four minutes). It is annotated and the
        # shard passes; the missing report then makes the `score` job report
        # the run as incomplete rather than score it. Any other non-zero exit
        # is Stryker itself failing (a broken initial test run) and fails.
        #
        # `--concurrency 2` rather than the config's 4: four test-runner
        # children plus the Stryker parent on a four-core runner is the
        # resource pressure that fitted the runs killed in August. Concurrency
        # changes only how long a run takes, never what it measures.
        env:
          MUTATE: ${{ matrix.shard.mutate }}
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("stryker.config.json","utf8"));c.mutate=process.env.MUTATE.split(",");c.thresholds={...c.thresholds,break:null};fs.writeFileSync("stryker.shard.json",JSON.stringify(c,null,2))'
          set +e
          npx stryker run stryker.shard.json --concurrency 2
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          case "$code" in
            130|137|143)
              echo "::warning title=Mutation shard did not finish::Stryker was killed by a signal (exit $code) before it could report. This is the runner going away, not the mutation score."
              exit 0
              ;;
            *)
              echo "::error title=Stryker failed::Stryker exited $code on shard ${{ matrix.shard.name }}."
              exit "$code"
              ;;
          esac
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.shard.name }}
          path: reports/mutation/
          if-no-files-found: ignore

  score:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-*
          path: reports/shards/
      - name: Pool the shard reports and apply the floor
        run: npx tsx tools/mutation/aggregate.ts reports/shards/
