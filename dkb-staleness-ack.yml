# dkb-staleness-ack.yml — human-acknowledged drift in pinned authorities.
#
# Each weekly DKB build re-fetches every pinned citation in the v3 DKB
# and compares its normalized SHA-256 against `content_hash_at_pin`. If
# any citation has drifted and the (node_id, citation) pair is not
# listed below, the build exits non-zero — spec-v3.md §14, Step 20.
#
# To acknowledge a drift, add an entry under `acknowledgments:` with:
#   - node_id:      the v3 DKB node id from the staleness report
#   - citation:     the citation string from the staleness report
#   - fetched_hash: the `fetched_hash` from that same staleness row — the
#                   version of the authority you actually reviewed
#   - ack:          a short human note explaining the disposition
#                   (e.g. "renumbered, no substantive change", "amendment
#                   under review by counsel — track via VAUL-1234").
#
# The hash is part of the match, so an acknowledgment covers ONE reviewed
# version of an authority, not the citation forever. When that authority
# changes again the gate re-arms and asks for a fresh review — without the
# hash, dispositioning one cosmetic renumbering permanently silenced every
# later change, including a substantive amendment. An entry missing
# `fetched_hash` is ignored, so the gate fails closed rather than open.
#
# An acknowledgment does not silence the rule-disable behavior — rules
# that depend on a stale node remain `enabled: false` until the pin is
# refreshed. The ack only allows the build to publish.

acknowledgments: []

# Citation-currency acknowledgments (fix-legal-authority-currency).
#
# The currency gate (tests/integration/dkb-currency-gate.test.ts) fails CI
# when any statute node in the LATEST dkb/dist artifact was retrieved more
# than the manifest's currency horizon ago (default 12 months) and is not
# listed below. Re-verifying the node against its source and bumping its
# `retrieved_at` is the fix; an acknowledgment only defers it visibly.
#   - node_id: the statute node id (e.g. stat-16-cfr-910)
#   - ack:     a short human note (e.g. "re-verification scheduled — VAUL-99")
currency_acknowledgments: []
